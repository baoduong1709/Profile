name: 🌐 Deploy Profile

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e

            APP_DIR="/var/www/profile"

            echo "═══════════════════════════════════════════"
            echo "🌐 Deploying Profile..."
            echo "═══════════════════════════════════════════"

            cd $APP_DIR

            echo "📥 Pulling latest code..."
            git reset --hard HEAD
            git pull origin main

            echo ""
            echo "✅ Profile deployed successfully!"
            echo "🌐 https://baoduong.dev"
